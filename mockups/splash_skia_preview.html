<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChrisRoi — Skia Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: #0a0807;
  font-family: system-ui, sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.bg {
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 70% 50% at 50% 55%, rgba(196,90,42,0.05) 0%, transparent 60%),
    radial-gradient(ellipse 100% 100% at 50% 50%, #110d0b 0%, #0a0706 100%);
  z-index: 0;
}

/* ─── Phone ─── */
.phone {
  width: 340px;
  height: 680px;
  border-radius: 48px;
  background: linear-gradient(145deg, #1a1410 0%, #0d0908 100%);
  box-shadow:
    0 0 0 2px rgba(255,255,255,0.04),
    0 50px 100px -30px rgba(0,0,0,0.7),
    0 0 140px -50px rgba(212,168,83,0.08);
  position: relative;
  z-index: 2;
  overflow: hidden;
}
.phone::before {
  content: '';
  position: absolute;
  top: 0; left: 50%;
  transform: translateX(-50%);
  width: 110px; height: 26px;
  background: #0a0706;
  border-radius: 0 0 16px 16px;
  z-index: 10;
}

.screen {
  position: absolute;
  inset: 4px;
  border-radius: 44px;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

.splash {
  width: 100%;
  height: 100%;
  background:
    radial-gradient(ellipse at 50% 60%, rgba(212,168,83,0.03) 0%, transparent 50%),
    linear-gradient(170deg, #14100e 0%, #0d0a09 50%, #110d0b 100%);
  position: relative;
}

/* ─── SVG layer ─── */
.svg-layer {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.svg-layer svg {
  width: 300px;
  height: 300px;
  overflow: visible;
}

/* ─── Big C background path (drawn via stroke-dasharray) ─── */
.bg-c-path {
  fill: none;
  stroke: rgba(212,168,83,0.07);
  stroke-width: 1.5;
  stroke-linecap: round;
  stroke-dasharray: 900;
  stroke-dashoffset: 900;
  animation: drawBgC 2.5s 0.3s ease-out forwards;
}
@keyframes drawBgC { to { stroke-dashoffset: 0; } }

/* ─── ChrisRoi draw effect ─── */
/* Using a wipe mask that slides from left to right */
.wipe-mask rect {
  animation: wipeReveal 2.5s 1.5s ease-out forwards;
}
@keyframes wipeReveal {
  0% { width: 0; }
  100% { width: 300; }
}

/* ─── Glow pulse on completion ─── */
.svg-layer svg {
  animation: pulseGlow 3s 4.5s ease-in-out infinite;
}
@keyframes pulseGlow {
  0%, 100% { filter: drop-shadow(0 0 0 transparent); }
  50% { filter: drop-shadow(0 0 20px rgba(212,168,83,0.35)); }
}

/* ─── Replay ─── */
.replay {
  position: absolute;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%);
  padding: 8px 18px;
  border-radius: 999px;
  border: 1px solid rgba(212,168,83,0.2);
  background: rgba(212,168,83,0.05);
  color: #d4a853;
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  cursor: pointer;
  opacity: 0;
  animation: fadeReplay 1s 5s ease-out forwards;
  z-index: 10;
}
@keyframes fadeReplay { to { opacity: 1; } }

.top-label {
  position: fixed;
  top: 24px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: #d4a853;
  opacity: 0.5;
  z-index: 10;
}

.note {
  margin-top: 20px;
  font-size: 11px;
  color: #6b5f55;
  letter-spacing: 0.5px;
  z-index: 2;
}
</style>
</head>
<body>

<div class="bg"></div>

<div class="top-label">Skia Path Tracing — Preview</div>

<div class="phone">
  <div class="screen">
    <div class="splash">

      <div class="svg-layer">
        <svg viewBox="0 0 300 300">
          <defs>
            <linearGradient id="goldStroke" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#f5e6c8"/>
              <stop offset="50%" stop-color="#d4a853"/>
              <stop offset="100%" stop-color="#b8860b"/>
            </linearGradient>
            <linearGradient id="goldFill" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#f5e6c8"/>
              <stop offset="100%" stop-color="#d4a853"/>
            </linearGradient>
            <!-- Mask: reveals text as rect grows -->
            <mask id="textMask">
              <rect x="0" y="0" width="300" height="300" fill="black"/>
              <rect x="0" y="120" width="0" height="60" fill="white" class="wipe-rect">
                <animate attributeName="width" from="0" to="300" dur="2.5s" begin="1.5s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
              </rect>
            </mask>
          </defs>

          <!-- Big C background -->
          <path class="bg-c-path" d="M 210 75 C 170 28, 95 24, 70 72 C 42 130, 60 210, 118 235 C 162 254, 205 244, 225 210"/>

          <!-- ChrisRoi revealed by mask -->
          <g mask="url(#textMask)">
            <text x="150" y="168" text-anchor="middle" style="font-family:'Great Vibes',cursive;font-size:58px;fill:url(#goldFill);">ChrisRoi</text>
          </g>

          <!-- Agence subtitle -->
          <text x="150" y="210" text-anchor="middle" style="font-family:'Cormorant Garamond',serif;font-size:14px;fill:#d4a853;fill-opacity:0;letter-spacing:6px;animation:fadeSub 1.5s 4s ease-out forwards;">AGENCE</text>
          <style>
            @keyframes fadeSub { to { fill-opacity: 0.5; } }
          </style>
        </svg>
      </div>

      <button class="replay" onclick="replay()">Replay</button>
    </div>
  </div>
</div>

<div class="note">En Skia : C du fond = Path animé · ChrisRoi = Text + ClipRect animé · Glow = Paint shadow</div>

<script>
function replay() {
  // Restart SVG animations
  const svg = document.querySelector('.svg-layer svg');
  svg.innerHTML = svg.innerHTML;
}

setInterval(replay, 10000);
</script>

</body>
</html>
