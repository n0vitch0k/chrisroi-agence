<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChrisRoi Agence — Splash & Icon Concepts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --warm-bg: #c45a2a;
  --warm-dark: #8a3a1a;
  --warm-gold: #d4a853;
  --warm-cream: #fdf8f3;
  --warm-deep: #3d2010;
  --dark-bg: #1a1410;
  --dark-surface: #241c18;
  --glass: rgba(255,255,255,0.08);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: #0f0d0c;
  color: #e8e0d8;
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ─── Header ─── */
.header {
  padding: 28px 40px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.header h1 {
  font-family: 'Playfair Display', serif;
  font-size: 22px;
  font-weight: 600;
  color: #f5ede6;
  letter-spacing: -0.3px;
}
.header .badge {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  color: var(--warm-gold);
  background: rgba(212,168,83,0.12);
  padding: 6px 14px;
  border-radius: 999px;
}

/* ─── Controls ─── */
.controls {
  display: flex;
  gap: 8px;
  padding: 20px 40px;
  border-bottom: 1px solid rgba(255,255,255,0.04);
  background: rgba(255,255,255,0.02);
}
.ctrl-btn {
  padding: 8px 18px;
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.08);
  background: rgba(255,255,255,0.03);
  color: #b8a99e;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  letter-spacing: 0.3px;
}
.ctrl-btn:hover { background: rgba(255,255,255,0.06); color: #e8e0d8; }
.ctrl-btn.active {
  background: rgba(196,90,42,0.15);
  border-color: rgba(196,90,42,0.3);
  color: #f5ede6;
}

/* ─── Stage ─── */
.stage {
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 60px 40px;
  min-height: calc(100vh - 160px);
  gap: 60px;
  flex-wrap: wrap;
}

/* ─── Phone mockup ─── */
.phone {
  width: 320px;
  height: 640px;
  border-radius: 44px;
  overflow: hidden;
  position: relative;
  box-shadow:
    0 0 0 2px rgba(255,255,255,0.06),
    0 40px 80px -20px rgba(0,0,0,0.6),
    0 0 120px -40px rgba(196,90,42,0.15);
}
.phone::before {
  content: '';
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100px;
  height: 24px;
  background: #0f0d0c;
  border-radius: 0 0 14px 14px;
  z-index: 10;
}
.phone-inner {
  width: 100%;
  height: 100%;
  position: relative;
  overflow: hidden;
}

/* ─── Variant A: Warm Earth Premium ─── */
.variant-a .phone-inner {
  background: linear-gradient(160deg, #8a3a1a 0%, #c45a2a 40%, #d4784a 100%);
}
.variant-a .particle {
  position: absolute;
  width: 3px;
  height: 3px;
  background: rgba(212,168,83,0.6);
  border-radius: 50%;
  animation: driftA 8s infinite ease-in-out;
}
@keyframes driftA {
  0%, 100% { transform: translateY(0) translateX(0); opacity: 0; }
  20% { opacity: 1; }
  80% { opacity: 1; }
  100% { transform: translateY(-120px) translateX(30px); opacity: 0; }
}
.variant-a .logo-c {
  width: 110px;
  height: 110px;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  animation: revealA 1.5s ease-out forwards;
}
.variant-a .logo-c svg { width: 100%; height: 100%; }
@keyframes revealA {
  0% { transform: translate(-50%, -50%) scale(0.7); opacity: 0; filter: blur(4px); }
  100% { transform: translate(-50%, -50%) scale(1); opacity: 1; filter: blur(0); }
}
.variant-a .glow-ring {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 180px;
  height: 180px;
  border: 1px solid rgba(212,168,83,0.25);
  border-radius: 50%;
  animation: ringA 3s infinite ease-out;
}
@keyframes ringA {
  0% { width: 130px; height: 130px; opacity: 0.6; }
  100% { width: 260px; height: 260px; opacity: 0; }
}
.variant-a .brand-text {
  position: absolute;
  bottom: 100px;
  left: 0;
  right: 0;
  text-align: center;
  animation: slideUpA 1s 0.6s ease-out both;
}
@keyframes slideUpA {
  0% { transform: translateY(20px); opacity: 0; }
  100% { transform: translateY(0); opacity: 1; }
}
.variant-a .brand-text h2 {
  font-family: 'Playfair Display', serif;
  font-size: 28px;
  font-weight: 600;
  color: #fff;
  letter-spacing: -0.3px;
}
.variant-a .brand-text p {
  font-size: 12px;
  font-weight: 500;
  color: rgba(255,255,255,0.7);
  margin-top: 6px;
  letter-spacing: 2px;
  text-transform: uppercase;
}

/* ─── Variant B: Dark Luxury ─── */
.variant-b .phone-inner {
  background: radial-gradient(ellipse at center, #241c18 0%, #1a1410 70%);
}
.variant-b .orb {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 200px;
  height: 200px;
  background: radial-gradient(circle, rgba(196,90,42,0.4) 0%, transparent 70%);
  border-radius: 50%;
  animation: pulseB 3s infinite ease-in-out;
}
@keyframes pulseB {
  0%, 100% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.5; }
  50% { transform: translate(-50%, -50%) scale(1.1); opacity: 0.8; }
}
.variant-b .logo-c-b {
  width: 100px;
  height: 100px;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  animation: revealB 1.8s ease-out forwards;
}
@keyframes revealB {
  0% { transform: translate(-50%, -50%) scale(0.6); opacity: 0; }
  60% { transform: translate(-50%, -50%) scale(1.05); opacity: 1; }
  100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
}
.variant-b .line-draw {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 120px;
  height: 120px;
}
.variant-b .line-draw svg { width: 100%; height: 100%; }
.variant-b .brand-text-b {
  position: absolute;
  bottom: 100px;
  left: 0;
  right: 0;
  text-align: center;
  animation: fadeB 1.2s 0.8s ease-out both;
}
@keyframes fadeB {
  0% { opacity: 0; transform: translateY(10px); }
  100% { opacity: 1; transform: translateY(0); }
}
.variant-b .brand-text-b h2 {
  font-family: 'Playfair Display', serif;
  font-size: 28px;
  font-weight: 600;
  color: #f5ede6;
  letter-spacing: -0.3px;
}
.variant-b .brand-text-b p {
  font-size: 11px;
  font-weight: 500;
  color: rgba(245,237,230,0.5);
  margin-top: 6px;
  letter-spacing: 2.5px;
  text-transform: uppercase;
}
.variant-b .grain {
  position: absolute;
  inset: 0;
  opacity: 0.03;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
}

/* ─── Variant C: Bold & Liquid ─── */
.variant-c .phone-inner {
  background: linear-gradient(135deg, #1a1410 0%, #3d2010 50%, #1a1410 100%);
  overflow: hidden;
}
.variant-c .shimmer {
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: conic-gradient(from 0deg, transparent 0deg, rgba(212,168,83,0.06) 60deg, transparent 120deg, rgba(196,90,42,0.04) 180deg, transparent 240deg, rgba(212,168,83,0.05) 300deg, transparent 360deg);
  animation: rotateC 12s linear infinite;
}
@keyframes rotateC {
  100% { transform: rotate(360deg); }
}
.variant-c .blob {
  position: absolute;
  width: 200px;
  height: 200px;
  filter: blur(60px);
  opacity: 0.4;
  border-radius: 50%;
}
.variant-c .blob-1 {
  background: var(--warm-bg);
  top: 30%;
  left: 50%;
  transform: translate(-50%, -50%);
  animation: blobMove1 6s infinite ease-in-out;
}
@keyframes blobMove1 {
  0%, 100% { transform: translate(-50%, -50%) scale(1); }
  50% { transform: translate(-30%, -60%) scale(1.2); }
}
.variant-c .blob-2 {
  background: var(--warm-gold);
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  animation: blobMove2 8s infinite ease-in-out;
  opacity: 0.2;
}
@keyframes blobMove2 {
  0%, 100% { transform: translate(-50%, -50%) scale(0.8); }
  50% { transform: translate(-70%, -40%) scale(1); }
}
.variant-c .logo-c-c {
  width: 100px;
  height: 100px;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  animation: revealC 2s ease-out forwards;
}
@keyframes revealC {
  0% { transform: translate(-50%, -50%) scale(0.5) rotate(-10deg); opacity: 0; filter: blur(8px); }
  100% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 1; filter: blur(0); }
}
.variant-c .brand-text-c {
  position: absolute;
  bottom: 100px;
  left: 0;
  right: 0;
  text-align: center;
  animation: slideC 1s 1s ease-out both;
}
@keyframes slideC {
  0% { transform: translateY(20px); opacity: 0; }
  100% { transform: translateY(0); opacity: 1; }
}
.variant-c .brand-text-c h2 {
  font-family: 'Playfair Display', serif;
  font-size: 28px;
  font-weight: 600;
  background: linear-gradient(135deg, #f5ede6 0%, #d4a853 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: -0.3px;
}
.variant-c .brand-text-c p {
  font-size: 11px;
  font-weight: 500;
  color: rgba(212,168,83,0.6);
  margin-top: 6px;
  letter-spacing: 2.5px;
  text-transform: uppercase;
}

/* ─── Info panel ─── */
.info-panel {
  max-width: 380px;
  padding: 10px 0 40px;
}
.info-panel h3 {
  font-family: 'Playfair Display', serif;
  font-size: 24px;
  font-weight: 600;
  color: #f5ede6;
  margin-bottom: 8px;
}
.info-panel .tag {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--warm-gold);
  margin-bottom: 16px;
}
.info-panel p {
  font-size: 13px;
  line-height: 1.7;
  color: #8a7d72;
  margin-bottom: 12px;
}
.info-panel .specs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 24px;
}
.info-panel .spec-item {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 10px;
  padding: 14px;
}
.info-panel .spec-item .label {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: #6b5f55;
  margin-bottom: 4px;
}
.info-panel .spec-item .value {
  font-size: 13px;
  font-weight: 500;
  color: #d4c8bc;
}

/* ─── Hidden ─── */
.hidden { display: none !important; }

/* ─── Responsive ─── */
@media (max-width: 900px) {
  .stage { flex-direction: column; align-items: center; }
  .info-panel { max-width: 320px; }
}
</style>
</head>
<body>

<div class="header">
  <h1>ChrisRoi Agence</h1>
  <span class="badge">Splash & Icon — 3 Concepts</span>
</div>

<div class="controls">
  <button class="ctrl-btn active" onclick="showVariant('a')">A — Warm Earth</button>
  <button class="ctrl-btn" onclick="showVariant('b')">B — Dark Luxury</button>
  <button class="ctrl-btn" onclick="showVariant('c')">C — Bold & Liquid</button>
</div>

<div class="stage" id="stage">

  <!-- ═══ VARIANT A ═══ -->
  <div class="phone variant-a" id="phone-a">
    <div class="phone-inner">
      <!-- Particles -->
      <div class="particle" style="left:20%;top:70%;animation-delay:0s"></div>
      <div class="particle" style="left:40%;top:80%;animation-delay:1.2s"></div>
      <div class="particle" style="left:60%;top:75%;animation-delay:2.5s"></div>
      <div class="particle" style="left:75%;top:85%;animation-delay:0.8s"></div>
      <div class="particle" style="left:30%;top:90%;animation-delay:3s"></div>
      <div class="particle" style="left:55%;top:72%;animation-delay:1.8s"></div>
      <div class="particle" style="left:80%;top:78%;animation-delay:3.5s"></div>
      <!-- Glow ring -->
      <div class="glow-ring"></div>
      <!-- Logo C monogram -->
      <div class="logo-c">
        <svg viewBox="0 0 110 110" fill="none">
          <defs>
            <linearGradient id="goldGradA" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#f5e6c8"/>
              <stop offset="50%" stop-color="#d4a853"/>
              <stop offset="100%" stop-color="#b8860b"/>
            </linearGradient>
          </defs>
          <rect width="110" height="110" rx="24" fill="rgba(255,255,255,0.1)" stroke="rgba(212,168,83,0.3)" stroke-width="1"/>
          <text x="55" y="72" text-anchor="middle" font-family="Playfair Display, serif" font-size="56" font-weight="700" fill="url(#goldGradA)">C</text>
        </svg>
      </div>
      <!-- Brand text -->
      <div class="brand-text">
        <h2>ChrisRoi</h2>
        <p>Agence de Placement</p>
      </div>
    </div>
  </div>

  <!-- ═══ VARIANT B ═══ -->
  <div class="phone variant-b hidden" id="phone-b">
    <div class="phone-inner">
      <div class="grain"></div>
      <div class="orb"></div>
      <div class="line-draw">
        <svg viewBox="0 0 120 120" fill="none">
          <circle cx="60" cy="60" r="55" stroke="rgba(196,90,42,0.2)" stroke-width="1" stroke-dasharray="4 4">
            <animateTransform attributeName="transform" type="rotate" from="0 60 60" to="360 60 60" dur="30s" repeatCount="indefinite"/>
          </circle>
        </svg>
      </div>
      <div class="logo-c-b">
        <svg viewBox="0 0 100 100" fill="none">
          <defs>
            <linearGradient id="warmGradB" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#e8a77f"/>
              <stop offset="100%" stop-color="#c45a2a"/>
            </linearGradient>
          </defs>
          <rect width="100" height="100" rx="22" fill="url(#warmGradB)"/>
          <text x="50" y="66" text-anchor="middle" font-family="Playfair Display, serif" font-size="50" font-weight="700" fill="#fff">C</text>
        </svg>
      </div>
      <div class="brand-text-b">
        <h2>ChrisRoi</h2>
        <p>Agence de Placement</p>
      </div>
    </div>
  </div>

  <!-- ═══ VARIANT C ═══ -->
  <div class="phone variant-c hidden" id="phone-c">
    <div class="phone-inner">
      <div class="shimmer"></div>
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
      <div class="logo-c-c">
        <svg viewBox="0 0 100 100" fill="none">
          <defs>
            <linearGradient id="goldGradC" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#f5e6c8"/>
              <stop offset="50%" stop-color="#d4a853"/>
              <stop offset="100%" stop-color="#b8860b"/>
            </linearGradient>
          </defs>
          <circle cx="50" cy="50" r="46" fill="rgba(196,90,42,0.15)" stroke="url(#goldGradC)" stroke-width="1.5"/>
          <text x="50" y="66" text-anchor="middle" font-family="Playfair Display, serif" font-size="50" font-weight="700" fill="url(#goldGradC)">C</text>
        </svg>
      </div>
      <div class="brand-text-c">
        <h2>ChrisRoi</h2>
        <p>Agence de Placement</p>
      </div>
    </div>
  </div>

  <!-- Info panel -->
  <div class="info-panel" id="info-panel">
    <!-- Dynamic content -->
  </div>
</div>

<script>
const info = {
  a: {
    title: 'A — Warm Earth Premium',
    tag: 'Conservateur · Chaleureux',
    desc: 'Fond terracotta dégradé inspiré du thème existant. Monogramme doré avec halo lumineux et particules dorées en lévitation. Animation douce et rassurante.',
    specs: [
      { label: 'Fond', value: 'Terracotta gradient' },
      { label: 'Accent', value: 'Or #d4a853' },
      { label: 'Icône', value: 'C doré sur fond verre' },
      { label: 'Motion', value: 'Drift + reveal' },
      { label: 'Durée', value: '~3s' },
      { label: 'Tonalité', value: 'Confiance, chaleur' }
    ]
  },
  b: {
    title: 'B — Dark Luxury',
    tag: 'Élégant · Minimaliste',
    desc: 'Fond sombre raffiné avec halo terracotta pulsant. Monogramme solide sur fond chaud. Grain subtil pour texture premium. Lignes orbitales animées.',
    specs: [
      { label: 'Fond', value: 'Charcoal profond' },
      { label: 'Accent', value: 'Terracotta #c45a2a' },
      { label: 'Icône', value: 'C blanc sur fond warm' },
      { label: 'Motion', value: 'Pulse + rotation' },
      { label: 'Durée', value: '~3.5s' },
      { label: 'Tonalité', value: 'Exclusivité, calme' }
    ]
  },
  c: {
    title: 'C — Bold & Liquid',
    tag: 'Audacieux · Dynamique',
    desc: 'Fond mouvant avec blobs terracotta et or en mouvement perpétuel. Effet conique subtil. Dégradé doré sur le typo. Le plus impactant visuellement.',
    specs: [
      { label: 'Fond', value: 'Gradient mouvant' },
      { label: 'Accent', value: 'Or + terracotta' },
      { label: 'Icône', value: 'C doré cerclé' },
      { label: 'Motion', value: 'Blob + shimmer' },
      { label: 'Durée', value: '~4s' },
      { label: 'Tonalité', value: 'Modernité, audace' }
    ]
  }
};

function showVariant(v) {
  document.querySelectorAll('.phone').forEach(p => p.classList.add('hidden'));
  document.querySelectorAll('.ctrl-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('phone-' + v).classList.remove('hidden');
  event.target.classList.add('active');
  renderInfo(v);
}

function renderInfo(v) {
  const d = info[v];
  const panel = document.getElementById('info-panel');
  panel.innerHTML = `
    <h3>${d.title}</h3>
    <div class="tag">${d.tag}</div>
    <p>${d.desc}</p>
    <div class="specs">
      ${d.specs.map(s => `<div class="spec-item"><div class="label">${s.label}</div><div class="value">${s.value}</div></div>`).join('')}
    </div>
  `;
}

// Init
renderInfo('a');

// Auto-advance animation loop for demo
let autoLoop = setInterval(() => {
  const phones = ['a','b','c'];
  const current = phones.find(p => !document.getElementById('phone-' + p).classList.contains('hidden'));
  const next = phones[(phones.indexOf(current) + 1) % 3];
  showVariant(next);
  // update button states
  document.querySelectorAll('.ctrl-btn').forEach((b,i) => {
    b.classList.toggle('active', phones[i] === next);
  });
}, 5000);
</script>

</body>
</html>
