<meta charset="UTF-8">
<!-- ETAPE 2 : animation splash sur base fidele v2. Sequence ~1,9 s, joue 1 fois.
     Boucle infinie = uniquement la pulsation douce du losange (tenue splash). -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf1e8">
<title>Chrisroi Agence — Splash anime v3</title>
<style>
  :root {
    --fond: #faf1e8;
    --u: min(100vw, 100dvh);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--fond);
  }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    padding-top: env(safe-area-inset-top, 0px);
    padding-right: env(safe-area-inset-right, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-left: env(safe-area-inset-left, 0px);
    position: relative;
    overflow: hidden;
  }
  svg { display: block; width: 100%; height: 100%; }
  .coin-tl {
    position: fixed; top: 0; left: 0;
    width: calc(var(--u) * 0.333984375);
    aspect-ratio: 342 / 280;
    animation: coinTL 0.9s ease-out 0.1s both;
  }
  .coin-br {
    position: fixed; right: 0; bottom: 0;
    width: calc(var(--u) * 0.3994140625);
    aspect-ratio: 409 / 217;
    animation: coinBR 0.9s ease-out 0.25s both;
  }
  .centre {
    position: fixed; inset: 0;
    display: grid; place-items: center;
    pointer-events: none;
  }
  .centre-inner {
    position: relative;
    width: calc(var(--u) * 0.66015625);
    aspect-ratio: 676 / 515;
  }
  .bloc-mono, .bloc-word {
    position: absolute; inset: 0;
  }
  .bloc-mono { animation: monoIn 1s ease-out 0.55s both; }
  .bloc-word { animation: wordIn 0.8s ease-out 1.05s both; }
  /* Losange : position exacte dans l'espace 676x515 du bloc central */
  .bloc-diamant {
    position: absolute;
    left: 47.78%; top: 62.14%; width: 7.1%; aspect-ratio: 48 / 55;
    transform-box: fill-box; transform-origin: center;
    animation: diamPop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) 1.25s both,
               diamPulse 1.8s ease-in-out 1.8s infinite;
  }
  @keyframes coinTL {
    from { opacity: 0; transform: translate(-6%, -6%); }
    to { opacity: 1; transform: none; }
  }
  @keyframes coinBR {
    from { opacity: 0; transform: translate(6%, 6%); }
    to { opacity: 1; transform: none; }
  }
  @keyframes monoIn {
    from { opacity: 0; transform: scale(0.96); }
    to { opacity: 1; transform: none; }
  }
  @keyframes wordIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: none; }
  }
  @keyframes diamPop {
    from { opacity: 0; transform: scale(0); }
    to { opacity: 1; transform: scale(1); }
  }
  @keyframes diamPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.12); }
  }
  @media (prefers-reduced-motion: reduce) {
    .coin-tl, .coin-br, .bloc-mono, .bloc-word, .bloc-diamant {
      animation: none !important;
    }
  }
</style>
